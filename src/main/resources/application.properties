spring.application.name=angur-gestion
server.port=8080

# La instancia local debe tener creado el esquema con src/main/resources/db/schema.sql.
# Configura DB_URL, DB_USER y DB_PASSWORD en el entorno; no guardes contraseñas aquí.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/angur_gestion?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# El esquema es explícito y se mantiene en db/schema.sql; Spring no lo modifica al arrancar.
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
