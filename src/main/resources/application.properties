spring.application.name=angur-gestion
server.port=${PORT:8080}

# La instancia local debe tener creado el esquema con src/main/resources/db/schema.sql.
# Configura DB_URL, DB_USER y DB_PASSWORD en el entorno; no guardes contraseñas aquí.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/angur_gestion_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# El esquema es explícito y se mantiene en db/schema.sql; Spring no lo modifica al arrancar.
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

server.servlet.session.timeout=20m
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
angur.auth.base-url=${AUTH_BASE_URL:http://localhost:8080}
angur.auth.mail-from=${AUTH_MAIL_FROM:no-reply@angur.local}
angur.auth.mail-enabled=${AUTH_MAIL_ENABLED:false}
angur.auth.verification-ttl=24h
angur.auth.reset-ttl=30m
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
