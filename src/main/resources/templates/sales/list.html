<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap"><section class="page-heading"><div><p class="eyebrow">Relación comercial</p><h1 th:text="${pageTitle}">Ventas</h1><p class="page-subtitle">Registro de operaciones con salida de inventario y precios históricos.</p></div><a class="btn btn-angur-primary" th:if="${canCreateSale}" th:href="@{/ventas/nueva}">Nueva venta</a></section><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel-card catalog-panel"><div class="panel-heading catalog-toolbar"><div><p class="eyebrow">Listado</p><h2>Operaciones registradas</h2></div><form class="search-form" method="get" th:action="@{/ventas}"><input class="form-control" name="q" th:value="${search}" placeholder="Folio o producto" aria-label="Buscar venta"><select class="form-select" name="estado"><option value="">Todos los estados</option><option value="REGISTRADA" th:selected="${statusFilter == 'REGISTRADA'}">Registrada</option><option value="CANCELADA" th:selected="${statusFilter == 'CANCELADA'}">Cancelada</option></select><button class="btn btn-outline-angur">Filtrar</button></form></div><div class="table-responsive" th:if="${!sales.isEmpty()}"><table class="table align-middle data-table"><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th th:if="${signedInRoleCode == 'ADMINISTRADOR' or signedInRoleCode == 'SUPERVISOR_VENTAS'}">Vendedor</th><th>Cotización</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="sale : ${sales}"><td th:text="${'#' + sale.id}"></td><td th:text="${sale.date}"></td><td th:text="${sale.clientName}"></td><td th:if="${signedInRoleCode == 'ADMINISTRADOR' or signedInRoleCode == 'SUPERVISOR_VENTAS'}" th:text="${sale.sellerName}"></td><td><a th:if="${sale.quoteId != null}" th:href="@{/cotizaciones/{id}(id=${sale.quoteId})}" th:text="${'#' + sale.quoteId}"></a><span th:unless="${sale.quoteId != null}">—</span></td><td th:text="${'$' + #numbers.formatDecimal(sale.total,1,'COMMA',2,'POINT')}"></td><td><span class="status-pill status-available" th:text="${sale.status.label}"></span></td><td><a class="btn btn-sm btn-outline-angur" th:href="@{/ventas/{id}(id=${sale.id})}">Ver detalle</a></td></tr></tbody></table></div><div class="empty-state" th:if="${sales.isEmpty()}"><span class="empty-state-mark">VT</span><h3>Aún no hay ventas</h3><p>Aquí aparecerán las ventas que registres.</p><a class="btn btn-angur-primary" th:if="${canCreateSale}" th:href="@{/ventas/nueva}">Registrar venta</a></div></section></div></main></div><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script></body></html>
