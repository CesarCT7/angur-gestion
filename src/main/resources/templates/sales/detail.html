<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap"><section class="page-heading"><div><p class="eyebrow">Venta registrada</p><h1 th:text="${'Folio #' + sale.id}">Venta</h1><p class="page-subtitle" th:text="${sale.date + ' · ' + sale.sellerName}">Fecha</p></div><div class="d-flex gap-2"><a class="btn btn-outline-angur" th:if="${sale.quoteId != null}" th:href="@{/cotizaciones/{id}(id=${sale.quoteId})}">Ver cotización</a><a class="btn btn-outline-angur" th:href="@{/ventas}">Volver</a></div></section><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><section class="panel-card"><p><strong>Cliente:</strong> <span th:text="${sale.clientName}"></span></p><p><strong>Estado:</strong> <span class="status-pill status-available" th:text="${sale.status.label}"></span></p><div class="table-responsive"><table class="table align-middle data-table"><thead><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th th:if="${showCosts}">Costo unitario</th><th>Subtotal</th></tr></thead><tbody><tr th:each="line : ${sale.lines}"><td th:text="${line.code}"></td><td th:text="${line.productName}"></td><td th:text="${line.quantity}"></td><td th:text="${'$' + #numbers.formatDecimal(line.unitPrice,1,'COMMA',2,'POINT')}"></td><td th:if="${showCosts}" th:text="${'$' + #numbers.formatDecimal(line.unitCost,1,'COMMA',2,'POINT')}"></td><td th:text="${'$' + #numbers.formatDecimal(line.subtotal,1,'COMMA',2,'POINT')}"></td></tr></tbody><tfoot><tr><th th:colspan="${showCosts ? 5 : 4}" class="text-end">Total</th><th th:text="${'$' + #numbers.formatDecimal(sale.total,1,'COMMA',2,'POINT')}"></th></tr></tfoot></table></div></section></div></main></div><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script></body></html>
