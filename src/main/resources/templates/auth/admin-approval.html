<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="login-page"><main class="setup-shell"><section class="setup-card"><a th:replace="~{auth/fields :: brand}"></a><h1>Solicitud de administrador</h1><div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div th:if="${valid}"><p>Se solicita crear una cuenta administradora para:</p><p><strong th:text="${request.name}"></strong><br><span th:text="${request.email}"></span><br>Usuario: <span th:text="${request.username}"></span></p><p>Al aprobar, enviaremos a esa dirección un enlace para definir su contraseña.</p><div class="d-flex gap-2"><form th:action="@{/aprobar-administrador/aprobar}" method="post"><input type="hidden" name="token" th:value="${token}"><button class="btn btn-angur-primary" type="submit">Aprobar solicitud</button></form><form th:action="@{/aprobar-administrador/rechazar}" method="post"><input type="hidden" name="token" th:value="${token}"><button class="btn btn-outline-angur" type="submit">Rechazar</button></form></div></div><p th:unless="${valid}">El enlace no es válido, ya se utilizó, venció o dejó de corresponder al administrador principal.</p><a class="back-link" th:href="@{/login}">Ir al inicio de sesión</a></section></main></body></html>
