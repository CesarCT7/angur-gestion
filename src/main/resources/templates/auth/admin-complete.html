<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="login-page"><main class="setup-shell"><section class="setup-card"><a th:replace="~{auth/fields :: brand}"></a><h1>Completa tu cuenta administradora</h1><div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${valid}"><p>Cuenta aprobada para <strong th:text="${request.name}"></strong> (<span th:text="${request.email}"></span>).</p><form th:action="@{/completar-admin}" th:object="${form}" method="post" class="setup-form" novalidate><input type="hidden" th:field="*{token}"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">Revisa los campos marcados.</div><div th:replace="~{auth/fields :: passwords}"></div><button class="btn btn-angur-primary w-100" type="submit">Crear cuenta administradora</button></form></div><p th:unless="${valid}">El enlace de invitación no es válido, ya se utilizó o venció. Contacta al administrador principal.</p><a class="back-link" th:href="@{/login}">Volver al inicio de sesión</a></section></main></body></html>
