<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap">
<div class="alert alert-danger" role="alert" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
<section class="page-heading"><div><p class="eyebrow">Administración</p><h1>Administradores</h1><p class="page-subtitle">El administrador principal aprueba las nuevas cuentas y puede transferir esa responsabilidad.</p></div><a class="btn btn-angur-primary" th:href="@{/usuarios/nuevo}">Solicitar administrador</a></section>
<section class="panel-card" th:if="${accounts != null}"><div class="table-responsive"><table class="table data-table align-middle"><caption class="visually-hidden">Cuentas administradoras de Angur Gestión</caption><thead><tr><th>Nombre</th><th>Usuario y correo</th><th>Correo</th><th>Estado</th><th>Responsabilidad</th><th>Acción</th></tr></thead><tbody><tr th:each="account : ${accounts}"><td th:text="${account.name}"></td><td><strong th:text="${account.username}"></strong><span class="table-secondary-line" th:text="${account.email}"></span></td><td th:text="${account.emailVerified} ? 'Verificado' : 'Pendiente'"></td><td><span class="status-pill" th:classappend="${account.active} ? ' status-available' : ' status-inactive'" th:text="${account.active} ? 'Activa' : 'Inactiva'"></span></td><td><span th:if="${principalId != null and account.id == principalId}" class="status-pill status-available">Administrador principal</span><span th:unless="${principalId != null and account.id == principalId}">Administrador</span></td><td><div class="d-flex gap-2"><form th:if="${canTransferPrincipal and account.id != principalId and account.active and account.emailVerified}" th:action="@{/usuarios/{id}/principal(id=${account.id})}" method="post"><button class="btn btn-sm btn-outline-angur" type="submit">Designar principal</button></form><form th:action="@{/usuarios/{id}/estado(id=${account.id})}" method="post"><input type="hidden" name="active" th:value="${!account.active}"><button class="btn btn-sm btn-outline-angur" type="submit" th:text="${account.active} ? 'Desactivar' : 'Activar'" th:disabled="${account.id == principalId}"></button></form></div></td></tr></tbody></table></div></section>
</div></main></div></body></html>
