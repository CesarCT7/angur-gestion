<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<a th:fragment="brand" class="setup-brand" th:href="@{/login}"><span>Angur</span><small>Gestión</small></a>
<div th:fragment="accountFields(mode)">
<div class="mb-3"><label class="form-label" for="name" th:text="${mode == 'setup'} ? 'Nombre' : 'Nombre o razón social'">Nombre</label>
<input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" maxlength="120" autocomplete="name" required aria-describedby="name-error"><div class="field-error" id="name-error" th:errors="*{name}"></div></div>
<div class="row g-3"><div class="col-md-6 mb-3"><label class="form-label" for="username">Usuario</label>
<input class="form-control" id="username" th:field="*{username}" th:errorclass="is-invalid" minlength="3" maxlength="80" autocomplete="username" required aria-describedby="username-help username-error"><div class="form-text" id="username-help">Letras sin acentos, números, punto, guion o guion bajo.</div><div class="field-error" id="username-error" th:errors="*{username}"></div></div>
<div class="col-md-6 mb-3"><label class="form-label" for="email">Correo electrónico</label>
<input class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid" type="email" maxlength="254" autocomplete="email" required aria-describedby="email-error"><div class="field-error" id="email-error" th:errors="*{email}"></div></div></div>
<div class="mb-3" th:if="${mode == 'admin'}"><label class="form-label" for="role">Perfil de acceso</label><select class="form-select" id="role" th:field="*{role}" required aria-describedby="role-error"><option th:each="role : ${roles}" th:value="${role}" th:text="${role.label}"></option></select><div class="field-error" id="role-error" th:errors="*{role}"></div></div>
<div th:replace="~{auth/fields :: passwords}"></div></div>
<div th:fragment="passwords"><div class="mb-3"><label class="form-label" for="password">Contraseña</label>
<div class="password-control"><input class="form-control" id="password" th:field="*{password}" th:errorclass="is-invalid" type="password" autocomplete="new-password" maxlength="72" required aria-describedby="password-help password-error"><button class="password-toggle" type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false">Mostrar</button></div>
<div class="form-text" id="password-help">Al menos 12 caracteres y hasta 72 bytes. Las letras acentuadas y algunos símbolos ocupan más de un byte.</div><div class="field-error" id="password-error" th:errors="*{password}"></div></div>
<div class="mb-3"><label class="form-label" for="passwordConfirmation">Confirmar contraseña</label><input class="form-control" id="passwordConfirmation" th:field="*{passwordConfirmation}" th:errorclass="is-invalid" type="password" autocomplete="new-password" maxlength="72" required aria-describedby="confirmation-error"><div class="field-error" id="confirmation-error" th:errors="*{passwordConfirmation}"></div></div></div>
</body></html>
