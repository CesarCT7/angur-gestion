<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body class="login-page setup-page"><main class="setup-shell auth-narrow"><section class="setup-card">
<a th:replace="~{auth/fields :: brand}"></a>
<div class="alert alert-danger" role="alert" th:if="${formError}" th:text="${formError}"></div>
<h1>Elige una nueva contraseña</h1><form th:if="${tokenValid}" th:action="@{/restablecer-clave}" th:object="${form}" method="post" class="setup-form" novalidate><p class="text-secondary">Al guardarla, se cerrarán las sesiones anteriores de tu cuenta.</p><div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">Revisa los campos marcados antes de continuar.</div><input type="hidden" th:field="*{token}"><div class="field-error" th:errors="*{token}"></div><div th:replace="~{auth/fields :: passwords}"></div><button class="btn btn-angur-primary w-100" type="submit">Guardar nueva contraseña</button></form><div th:unless="${tokenValid}"><p>El enlace no es válido, ya se utilizó o ha vencido.</p><a class="btn btn-angur-primary" th:href="@{/recuperar-clave}">Solicitar otro enlace</a></div><a class="back-link" th:href="@{/login}">Volver a iniciar sesión</a>
</section></main></body></html>
