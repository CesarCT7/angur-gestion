<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap">
<div class="alert alert-danger" role="alert" th:if="${formError}" th:text="${formError}"></div>
<section class="page-heading"><div><p class="eyebrow">Administración</p><h1>Solicitar administrador</h1><p class="page-subtitle">El administrador principal recibirá un correo para aprobar o rechazar la solicitud. La persona elegida definirá su contraseña después de la aprobación.</p></div></section>
<section class="panel-card product-form-panel"><form th:action="@{/usuarios/nuevo}" th:object="${form}" method="post" novalidate>
<div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">Revisa los campos marcados antes de continuar.</div>
<div class="mb-3"><label class="form-label" for="name">Nombre</label><input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" maxlength="120" required><div class="field-error" th:errors="*{name}"></div></div>
<div class="row g-3"><div class="col-md-6 mb-3"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" th:field="*{username}" th:errorclass="is-invalid" minlength="3" maxlength="80" required><div class="field-error" th:errors="*{username}"></div></div><div class="col-md-6 mb-3"><label class="form-label" for="email">Correo de la persona</label><input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid" maxlength="254" required><div class="field-error" th:errors="*{email}"></div></div></div>
<div class="form-actions"><a class="btn btn-outline-angur" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-angur-primary" type="submit">Enviar solicitud</button></div></form></section></div></main></div></body></html>
