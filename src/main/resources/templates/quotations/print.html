<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${'Cotización #' + quote.id + ' · Angur Gestión'}"></title><link rel="stylesheet" th:href="@{/css/angur.css}"><style>@media print{.print-actions{display:none}body{background:white}.print-sheet{box-shadow:none!important;border:0!important}}</style></head><body class="app-page"><main class="container py-5"><section class="panel-card print-sheet"><div class="d-flex justify-content-between"><div><h1>Angur Gestión</h1><p>Cotización <strong th:text="${'#' + quote.id}">#1</strong></p></div><div class="text-end"><strong th:text="${quote.issuedAt}">Fecha</strong><br><span class="status-pill" th:text="${quote.status.label}">Pendiente</span></div></div><hr><p><strong>Cliente:</strong> <span th:text="${quote.clientName}"></span></p><p><strong>Contacto:</strong> <span th:text="${quote.clientEmail == null ? '—' : quote.clientEmail}"></span> · <span th:text="${quote.clientPhone == null ? '—' : quote.clientPhone}"></span></p><table class="table"><thead><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="line : ${quote.lines}"><td th:text="${line.code}"></td><td th:text="${line.productName}"></td><td th:text="${line.quantity}"></td><td th:text="${'$' + #numbers.formatDecimal(line.unitPrice,1,'COMMA',2,'POINT')}"></td><td th:text="${'$' + #numbers.formatDecimal(line.subtotal,1,'COMMA',2,'POINT')}"></td></tr></tbody><tfoot><tr><th colspan="4" class="text-end">Total</th><th th:text="${'$' + #numbers.formatDecimal(quote.total,1,'COMMA',2,'POINT')}"></th></tr></tfoot></table><p th:if="${quote.observations != null}" th:text="${quote.observations}"></p><p>Atendió: <span th:text="${quote.sellerName}"></span></p><div class="print-actions"><button class="btn btn-angur-primary" onclick="window.print()">Imprimir</button></div></section></main></body></html>
