<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap"><section class="page-heading"><div><p class="eyebrow">Relación comercial</p><h1>Nueva cotización</h1><p class="page-subtitle">El sistema calcula importes con los precios vigentes y los conserva en esta propuesta.</p></div><a class="btn btn-outline-angur" th:href="@{/cotizaciones}">Volver</a></section><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel-card"><form method="post" th:action="@{/cotizaciones/nueva}" th:object="${form}" class="form-grid">
<div class="mb-3"><label class="form-label" for="clientId">Cliente</label><select class="form-select" id="clientId" th:field="*{clientId}" required><option value="">Selecciona cliente</option><option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}">Cliente</option></select><div class="text-danger" th:errors="*{clientId}"></div></div><div class="mb-3"><label class="form-label" for="observations">Observaciones</label><textarea class="form-control" id="observations" rows="2" th:field="*{observations}" maxlength="1000"></textarea><div class="text-danger" th:errors="*{observations}"></div></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Producto</th><th style="width:150px">Cantidad</th><th style="width:170px">Precio actual</th><th style="width:130px">Acción</th></tr></thead><tbody id="quote-lines"><tr th:each="line,stat : *{items}" class="quote-line"><td><select class="form-select product-select" th:field="*{items[__${stat.index}__].productId}" required><option value="">Selecciona producto</option><option th:each="p : ${products}" th:value="${p.id}" th:attr="data-price=${p.salePrice}" th:text="${p.code + ' · ' + p.name}">Producto</option></select></td><td><input class="form-control" type="number" min="1" max="4294967295" required th:field="*{items[__${stat.index}__].quantity}"></td><td class="price-cell">—</td><td><button class="btn btn-sm btn-outline-danger-soft remove-line" type="button">Quitar</button></td></tr></tbody></table></div><button class="btn btn-outline-angur" type="button" id="add-line">Agregar producto</button><p class="text-danger" th:errors="*{items}"></p><div class="d-flex justify-content-end gap-2 mt-3"><a class="btn btn-outline-angur" th:href="@{/cotizaciones}">Cancelar</a><button class="btn btn-angur-primary" type="submit">Emitir cotización pendiente</button></div></form></section></div></main></div>
<script>const body=document.getElementById('quote-lines');function renumber(){[...body.querySelectorAll('tr')].forEach((row,i)=>row.querySelectorAll('[name]').forEach(el=>{el.name=el.name.replace(/items\[\d+\]/,`items[${i}]`);el.id=el.name.replace(/[\[\].]/g,'_')}));}document.getElementById('add-line').addEventListener('click',()=>{const row=body.querySelector('tr').cloneNode(true);row.querySelectorAll('select,input').forEach(el=>el.value='');row.querySelector('.price-cell').textContent='—';body.append(row);renumber()});body.addEventListener('click',e=>{if(e.target.matches('.remove-line')&&body.querySelectorAll('tr').length>1){e.target.closest('tr').remove();renumber()}});body.addEventListener('change',e=>{if(e.target.matches('.product-select')){const price=e.target.selectedOptions[0]?.dataset.price; e.target.closest('tr').querySelector('.price-cell').textContent=price?'$'+Number(price).toLocaleString('es-MX',{minimumFractionDigits:2}):'—'}});</script><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script></body></html>
