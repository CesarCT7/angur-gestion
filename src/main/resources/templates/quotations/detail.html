<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main class="main-content"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="content-wrap"><section class="page-heading"><div><p class="eyebrow">Cotización</p><h1 th:text="${'Folio #' + quote.id}">Cotización</h1><p class="page-subtitle" th:text="${quote.issuedAt}">Fecha</p></div><div class="d-flex gap-2"><a class="btn btn-outline-angur" th:href="@{/cotizaciones/{id}/imprimir(id=${quote.id})}" target="_blank">Imprimir</a><a class="btn btn-outline-angur" th:href="@{/cotizaciones}">Volver</a></div></section><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><section class="panel-card"><div class="d-flex justify-content-between"><div><p><strong>Cliente:</strong> <span th:text="${quote.clientName}"></span></p><p><strong>Vendedor:</strong> <span th:text="${quote.sellerName}"></span></p><p><strong>Estado:</strong> <span class="status-pill" th:text="${quote.status.label}"></span></p><p th:if="${quote.observations != null and !quote.observations.isBlank()}" th:text="${quote.observations}"></p></div><div class="d-flex gap-2 align-items-start" th:if="${canChangeStatus}"><form method="post" th:action="@{/cotizaciones/{id}/aceptar(id=${quote.id})}"><button class="btn btn-angur-primary">Aceptar</button></form><form method="post" th:action="@{/cotizaciones/{id}/rechazar(id=${quote.id})}"><button class="btn btn-outline-danger-soft">Rechazar</button></form></div></div><div class="table-responsive"><table class="table align-middle data-table"><thead><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr></thead><tbody><tr th:each="line : ${quote.lines}"><td th:text="${line.code}">Código</td><td th:text="${line.productName}">Producto</td><td th:text="${line.quantity}">1</td><td th:text="${'$' + #numbers.formatDecimal(line.unitPrice,1,'COMMA',2,'POINT')}"></td><td th:text="${'$' + #numbers.formatDecimal(line.subtotal,1,'COMMA',2,'POINT')}"></td></tr></tbody><tfoot><tr><th colspan="4" class="text-end">Total</th><th th:text="${'$' + #numbers.formatDecimal(quote.total,1,'COMMA',2,'POINT')}"></th></tr></tfoot></table></div><a class="btn btn-angur-primary" th:if="${quote.status.name() == 'ACEPTADA' and quote.saleId == null and canCreateQuote}" th:href="@{/ventas/nueva/cotizacion/{id}(id=${quote.id})}">Registrar venta</a><a class="btn btn-outline-angur" th:if="${quote.saleId != null}" th:href="@{/ventas/{id}(id=${quote.saleId})}">Ver venta #<span th:text="${quote.saleId}"></span></a></section></div></main></div><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script></body></html>
